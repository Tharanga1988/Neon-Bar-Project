<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon & Night | Bar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="shortcut icon" href="images/Fevicon-logo.png" type="image/x-icon">
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <header>
        <nav>
            <a href="index.html" class="logo">NEON & NIGHT</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-contact">
        <form class="contact-form" action="#" method="POST">
            <fieldset>
                <legend>Contact Us</legend>

                <div class="form-fields">
                    <div class="form-group">
                        <label for="name1">First Name *</label>
                        <input type="text" required placeholder="Firstname" name="name1" id="name1" minlength="2">
                    </div>

                    <div class="form-group">
                        <label for="name2">Last Name *</label>
                        <input type="text" required placeholder="Lastname" name="name2" id="name2" minlength="2">
                    </div>

                    <div class="form-group">
                        <label for="tel">Phone *</label>
                        <input type="tel" required placeholder="+46******" name="phone" id="tel"
                            pattern="[+0-9\s\-]{8,15}">
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" required placeholder="xxxxx@email.com" name="email" id="email">
                    </div>

                    <div class="form-group full-width">
                        <label for="subject">Reason for contact *</label>
                        <select name="subject" id="subject" required>
                            <option value="" selected disabled>Choose a reason</option>
                            <option value="Bookings">Bookings</option>
                            <option value="Complaints">Complaints</option>
                            <option value="Suggestions">Suggestions</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="message">Write your message here *</label>
                        <textarea name="message" required id="message" rows="5"
                            placeholder="Type your message..."></textarea>
                    </div>

                    <div class="form-group full-width checkbox-group">
                        <input type="checkbox" name="newsletter" id="checkbox">
                        <label for="checkbox">Sign up to our newsletter</label>
                    </div>

                    <div class="form-actions full-width">
                        <button class="btn Clearbtn" type="reset">Clear</button>
                        <button class="btn Submitbtn" type="submit">Submit</button>
                    </div>
                </div>
            </fieldset>
        </form>
    </main>

    <footer>
        <p> &copy; 2026 Neon & Night Bar. All rights reserved.</p>
    </footer>
</body>

</html>
